<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Ropa</title>
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <div class="seccion-productos">
            <h1>Tienda Solarpunk</h1>
            <div id="filtros">
                <h3>Filtro:</h3>
                <div id="filtros-atributos"></div>
                    <button id="btn-limpiar-filtros" style="margin-top:10px;">Limpiar filtros</button>
            </div>
            <div id="productos"></div>
        </div>

        <div class="seccion-carrito">
            <h2>🛒 Carrito</h2>
            <div id="carrito-items"></div>
            <div id="total-carrito">Total: $0.00</div>
            <button class="btn-comprar" onclick="comprar()">Realizar Compra</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
